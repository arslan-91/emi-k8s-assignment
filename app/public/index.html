<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Loan EMI Calculator</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
<div class="container py-4" style="max-width: 800px;">
  <h2 class="mb-4 text-center">Loan EMI Calculator</h2>

  <form id="emiForm" class="card card-body mb-4" novalidate>
    <div class="mb-3">
      <label class="form-label" for="principal">Loan Amount (P)</label>
      <input type="number" class="form-control" id="principal" min="1" step="any" required>
    </div>
    <div class="mb-3">
      <label class="form-label" for="rate">Annual Interest Rate (%)</label>
      <input type="number" class="form-control" id="rate" min="0.01" step="any" required>
    </div>
    <div class="mb-3">
      <label class="form-label" for="months">Tenure (months)</label>
      <input type="number" class="form-control" id="months" min="1" step="1" required>
    </div>
    <div id="formError" class="text-danger mb-2"></div>
    <button type="submit" class="btn btn-primary">Calculate</button>
  </form>

  <div id="resultPanel" class="card card-body mb-4 d-none">
    <h5>Result</h5>
    <p class="mb-1">Monthly EMI: <strong id="resEmi"></strong></p>
    <p class="mb-1">Total Payment: <strong id="resTotal"></strong></p>
    <p class="mb-1">Total Interest: <strong id="resInterest"></strong></p>
    <p class="mb-0 text-muted">Served by pod: <span id="resPod"></span> (<span id="resIp"></span>)</p>
  </div>

  <h5>Last 10 Calculations</h5>
  <table class="table table-striped table-sm">
    <thead>
      <tr><th>Principal</th><th>Rate %</th><th>Months</th><th>EMI</th><th>Served By</th><th>Time</th></tr>
    </thead>
    <tbody id="historyBody"></tbody>
  </table>
</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="app.js"></script>
</body>
</html>
