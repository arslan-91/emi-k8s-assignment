# Ek baar chalta hai: replica set rs0 initiate karta hai (1 PRIMARY + 2 SECONDARY)
apiVersion: batch/v1
kind: Job
metadata:
  name: mongo-init
  namespace: emi
spec:
  backoffLimit: 10
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: init
          image: mongo:6
          command:
            - bash
            - -c
            - |
              set -e
              H0=mongo-0.mongo.emi.svc.cluster.local:27017
              H1=mongo-1.mongo.emi.svc.cluster.local:27017
              H2=mongo-2.mongo.emi.svc.cluster.local:27017
              for h in $H0 $H1 $H2; do
                until mongosh --host "$h" --quiet --eval "db.adminCommand('ping').ok" >/dev/null 2>&1; do
                  echo "waiting for $h ..."; sleep 3
                done
              done
              echo "all members up, initiating replica set"
              mongosh --host "$H0" --quiet --eval "
                try {
                  rs.status();
                  print('replica set already initiated');
                } catch (e) {
                  rs.initiate({
                    _id: 'rs0',
                    members: [
                      { _id: 0, host: '$H0', priority: 2 },
                      { _id: 1, host: '$H1' },
                      { _id: 2, host: '$H2' }
                    ]
                  });
                }
              "
